<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Mukti - कर्ज मुक्ति</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🏦</div>
            <h1>Loan Mukti</h1>
            <p>कर्ज से छुटकारा पाएं</p>
        </header>

        <main>
            <!-- Monthly Budget -->
            <div class="card">
                <label>💰 महीने की बचत (Monthly Savings)</label>
                <div class="input-box">
                    <span>₹</span>
                    <input type="number" id="budget" placeholder="25000" inputmode="numeric">
                </div>
            </div>

            <!-- Loans Container -->
            <div id="loans">
                <!-- Loan cards added here -->
            </div>

            <button class="add-btn" onclick="addLoan()">
                ➕ एक और लोन जोड़ें
            </button>

            <!-- Calculate Button -->
            <button class="big-btn" onclick="calculate()">
                📊 गणना करें
                <small>Calculate</small>
            </button>

            <!-- Results -->
            <div class="result" id="result"></div>
        </main>

        <footer>Made with ❤️ in India</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
